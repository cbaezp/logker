[package]
name = "logker"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = "0.26" 
iptables = "0.5.2"
tokio = { version = "1", features = ["full"] }
notify = "6.1.1"
regex = "1.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.1", features = ["derive"] }
daemonize = "0.4"

[lib]
name = "logker"
path = "src/lib.rs"
